<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Lanette</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-logo" id="brand-logo" aria-hidden="true"></span>
          <span data-i18n="app.title" data-tauri-drag-region>Lanette</span>
        </div>
        <div class="tb-actions">
          <button class="tb-btn" id="btn-settings" type="button" data-i18n-title="titlebar.settings">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9.2a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6zM19.4 13.5l1.4 1.1-1.8 3.1-1.7-.6a7 7 0 0 1-1.9 1.1L15 20h-3.6l-.4-1.8a7 7 0 0 1-1.9-1.1l-1.7.6-1.8-3.1 1.4-1.1a7 7 0 0 1 0-2.2L3.6 10.2l1.8-3.1 1.7.6A7 7 0 0 1 9 6.6L9.4 4.8H13l.4 1.8a7 7 0 0 1 1.9 1.1l1.7-.6 1.8 3.1-1.4 1.1a7 7 0 0 1 0 2.2z"/></svg>
          </button>
          <button class="tb-btn" id="btn-min" type="button" data-i18n-title="titlebar.minimize">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
          </button>
          <button class="tb-btn close" id="btn-close" type="button" data-i18n-title="titlebar.close">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>

      <div class="toolbar">
        <div class="search">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM20 20l-4.8-4.8"/></svg>
          <input
            id="search"
            type="text"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-controls="content"
            aria-expanded="true"
            data-i18n-placeholder="toolbar.search"
          />
        </div>
        <div id="view-toggle" class="toolbar-seg"></div>
        <div id="size-toggle" class="toolbar-seg"></div>
        <button class="icon-toggle" id="btn-paths" type="button" aria-pressed="true" data-i18n-title="toolbar.hidePaths">
          <svg class="ico eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12s3-6 8.5-6 8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6zM12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM4 4l16 16"/></svg>
          <svg class="ico eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12s3-6 8.5-6 8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6zM12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>
        </button>
        <button class="btn primary" id="btn-add" type="button" data-i18n-title="toolbar.addTitle">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="toolbar.add">Ajouter</span>
        </button>
      </div>

      <nav class="tabs" id="tabs" role="tablist"></nav>

      <main class="content" id="content" role="listbox" tabindex="-1"></main>

    </div>

    <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
      <div class="drop-box">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>
        <strong data-i18n="drop.title">Déposez pour ajouter</strong>
        <span class="drop-sub"></span>
      </div>
    </div>
    <div id="layer"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
