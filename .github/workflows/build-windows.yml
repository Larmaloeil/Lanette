# Compile Lanette pour Windows à chaque push.
# Sur main, publie automatiquement une Release GitHub « vX.Y.Z » dès que la
# version de tauri.conf.json change : c'est là que le bouton « Vérifier les
# mises à jour » de l'application va chercher les nouvelles versions.
name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Installer les dépendances
        run: npm install

      - name: Compiler (release + installeur NSIS)
        run: npm run build

      - name: Vérifier la taille (objectif < 15 Mo)
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/lanette.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "Exécutable : {0:N2} Mo" -f ($exe.Length / 1MB)
          "Installeur : {0:N2} Mo" -f ($setup.Length / 1MB)
          if ($exe.Length -gt 15MB -or $setup.Length -gt 15MB) { throw "Objectif de taille dépassé" }

      - name: Préparer la version portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Lanette-portable | Out-Null
          Copy-Item src-tauri/target/release/lanette.exe dist/Lanette-portable/Lanette.exe
          Set-Content dist/Lanette-portable/portable "Supprimez ce fichier pour stocker les données dans AppData."
          Compress-Archive -Path dist/Lanette-portable/* -DestinationPath dist/Lanette-portable.zip -Force

      - name: Publier les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: Lanette-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/Lanette-portable.zip

      - name: Publier la Release de cette version (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "La Release $tag existe déjà : rien à publier (augmentez la version pour publier une mise à jour)."
            exit 0
          }
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          gh release create $tag $setup.FullName dist/Lanette-portable.zip `
            --target $env:GITHUB_SHA --title "Lanette $version" --generate-notes
